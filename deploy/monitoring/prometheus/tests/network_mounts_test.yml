# Unit tests for the network_mounts alerts. Run from the repository root:
#   docker run --rm -v "$PWD/deploy/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool \
#       prom/prometheus:v3.5.0 test rules /etc/prometheus/tests/network_mounts_test.yml
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # The share is mounted for 30 minutes, then disappears.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="host:9100", job="node", device="//nas/share", fstype="cifs", mountpoint="/mnt/nas"}'
        values: '1e12x30 _x60'
      - series: 'node_filesystem_size_bytes{instance="host:9100", job="node", device="/dev/sda1", fstype="ext4", mountpoint="/"}'
        values: '1e11x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: NetworkMountMissing
        exp_alerts: []
      # Gone for 14 minutes: still within the 20m allowance (e.g. a reboot).
      - eval_time: 45m
        alertname: NetworkMountMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: NetworkMountMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host:9100
              job: node
              device: //nas/share
              fstype: cifs
              mountpoint: /mnt/nas
            exp_annotations:
              summary: "Network share /mnt/nas is no longer mounted"
              description: "Remount with: sudo mount /mnt/nas (or sudo mount -a). This alert stops on its own after 7 days unmounted."

  # The file server stops answering: node-exporter reports a device error.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_device_error{instance="host:9100", job="node", device="//nas/share", fstype="cifs", mountpoint="/mnt/nas"}'
        values: '0x10 1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: NetworkMountUnreachable
        exp_alerts: []
      - eval_time: 20m
        alertname: NetworkMountUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host:9100
              job: node
              device: //nas/share
              fstype: cifs
              mountpoint: /mnt/nas
            exp_annotations:
              summary: "Network share /mnt/nas is not responding"
              description: "The file server is down, unreachable or rejected the credentials. Check: ls /mnt/nas; sudo dmesg | grep -iE 'cifs|smb|nfs' | tail"

  # A local disk never triggers either alert.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="host:9100", job="node", device="/dev/sdb1", fstype="ext4", mountpoint="/data"}'
        values: '1e11x10 _x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: NetworkMountMissing
        exp_alerts: []

  # WATCH_MOUNTS check: the file is rewritten every 15m but scraped every
  # 30s, so Prometheus sees a continuous value. The share fails at 30m: the
  # next check (45m) is still inside the 20m allowance, the alert fires by 60m.
  - interval: 1m
    input_series:
      - series: 'safefamily_mount_ok{instance="host:9100", job="node", mountpoint="/mnt/nas"}'
        values: '1x29 0x40'
    alert_rule_test:
      - eval_time: 45m
        alertname: WatchedMountDown
        exp_alerts: []
      - eval_time: 60m
        alertname: WatchedMountDown
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host:9100
              job: node
              mountpoint: /mnt/nas
            exp_annotations:
              summary: "Watched share /mnt/nas is not mounted or not answering"
              description: "Check: findmnt /mnt/nas; ls /mnt/nas; sudo systemctl status $(systemd-escape -p --suffix=automount /mnt/nas)"

# Monitoring stack for SafeFamily: Prometheus + Alertmanager + Grafana and the
# exporters that feed them. Used as an overlay on the main compose file, so
# relative paths below resolve from the repository root:
#
#   docker compose -f docker-compose.yml -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# or set COMPOSE_FILE once in .env and keep using plain `docker compose ...`:
#
#   COMPOSE_FILE=docker-compose.yml:deploy/monitoring/docker-compose.monitoring.yml
#
# Setup, alerts and dashboards are described in docs/monitoring.md.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: safefamily_prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      # Localhost only; reach it through an SSH tunnel when debugging queries.
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: safefamily_alertmanager
    restart: always
    # Alertmanager cannot read env vars from its config, so render the
    # template with the mail settings from .env before starting.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      MAIL_ACCOUNT: ${MAIL_ACCOUNT:?MAIL_ACCOUNT must be set in .env for alert emails}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set in .env for alert emails}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${MAIL_ACCOUNT}}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-smtp.gmail.com:587}
    volumes:
      - ./deploy/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:12.1.1
    container_name: safefamily_grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Localhost by default. Set GRAFANA_BIND=0.0.0.0 (and firewall it) to
      # open it to your LAN.
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"

  # Host CPU, memory and free space of every mounted filesystem, including the
  # one holding the Postgres volume. Also exports *.prom files written by
  # scripts/db_backup.sh and scripts/monitoring/dir_sizes.sh.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: safefamily_node_exporter
    restart: always
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/snap/docker/common/var-lib-docker/.+|snap/.+)($|/)
    volumes:
      - /:/host:ro
      - ${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}:/textfile:ro

  # Per-container CPU, memory, network and "is it running".
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: safefamily_cadvisor
    restart: always
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Snap-installed Docker keeps its data in
      # /var/snap/docker/common/var-lib-docker; set DOCKER_ROOT_DIR to that.
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # Database up/down, size, connections, transaction and cache stats.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: safefamily_postgres_exporter
    restart: always
    depends_on:
      - db
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME:-logdb}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-user}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-pass}

  # Nginx request rate and connection counts from the internal stub_status
  # endpoint in deploy/nginx/nginx.docker.conf.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: safefamily_nginx_exporter
    restart: always
    depends_on:
      - proxy
    command:
      - --nginx.scrape-uri=http://proxy:8080/stub_status

  # Loads the website through nginx like a browser would: up/down, response
  # time, HTTP status and TLS certificate expiry.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: safefamily_blackbox_exporter
    restart: always
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./deploy/monitoring/blackbox:/etc/blackbox:ro

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# WebSocket upgrade for Grafana Live (/grafana/api/live/ws).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# PUBLIC HTTP SERVER (Redirect to HTTPS)
server {
    listen 80;
    server_name zzuse.duckdns.org;
    return 301 https://$server_name$request_uri;
}

# PUBLIC HTTPS SERVER
server {
    listen 443 ssl;
    server_name zzuse.duckdns.org;
    client_max_body_size 50m;

    ssl_certificate /etc/nginx/ssl/safefamily.crt;
    ssl_certificate_key /etc/nginx/ssl/safefamily.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GRAFANA (deploy/monitoring/), home network only: anything else gets 403.
    # Grafana serves from /grafana/ itself (GF_SERVER_SERVE_FROM_SUB_PATH), so
    # the path is passed through unchanged. No rate limit: one dashboard page
    # loads dozens of files at once.
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        # Look Grafana up per request (Docker DNS), so nginx still starts when
        # the monitoring stack is not running; then this returns 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# INTERNAL STATUS SERVER (scraped by nginx-exporter, see deploy/monitoring/).
# Port 8080 is not published in docker-compose.yml, so it is reachable only
# from containers on the compose network.
server {
    listen 8080;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}
